<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>完善权限 · 小蓝代理工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/dialog.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <main class="permissions-page">
    <h1>完成连接前的最后一步</h1>
    <p class="permissions-intro">请允许以下权限，让小蓝能够应用代理设置。</p>
    <section class="permission-card site-permissions-required">
      <h2>网站访问权限</h2>
      <p>允许小蓝根据当前网站匹配代理规则。</p>
      <button id="grant-permissions-btn" class="om-btn om-btn-primary" type="button">允许网站访问</button>
    </section>
    <section class="permission-card incognito-access-required">
      <h2>隐私窗口权限</h2>
      <p>请在浏览器的扩展管理页中，允许小蓝在隐私窗口中运行。设置完成后，重新打开代理弹窗。</p>
      <ol class="permission-steps">
        <li><span>1</span><div><strong>打开扩展管理</strong><p>从浏览器菜单进入扩展或附加组件管理页面。</p></div></li>
        <li><span>2</span><div><strong>找到小蓝代理工具</strong><p>打开扩展详情，找到隐私窗口相关设置。</p></div></li>
        <li><span>3</span><div><strong>允许在隐私窗口中运行</strong><p>完成设置后，重新打开小蓝弹窗即可。</p></div></li>
      </ol>
    </section>
    <p id="permissions-error" class="om-text-danger" role="alert" hidden></p>
  </main>
  <dialog class="loading-dialog" aria-label="检查权限">正在检查权限……</dialog>
  <script src="../js/omega_target_popup.js"></script>
  <script src="js/grant_permissions.js"></script>
</body>
</html>
