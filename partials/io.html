<div class="page-header">
  <h2>{{'options_tab_importExport' | tr}}</h2>
  <p>保存一份配置备份，或从本地文件恢复已有设置。</p>
</div>

<div class="io-grid">
  <section class="io-card">
    <div class="io-card-icon io-card-icon-export" aria-hidden="true">
      <span class="glyphicon glyphicon-floppy-save"></span>
    </div>
    <div class="io-card-body">
      <h3>{{'options_ioExportTitle' | tr}}</h3>
      <p class="help-block">{{'options_makeBackupHelp' | tr}}</p>
      <button ng-click="runAction(exportOptions())" class="btn btn-primary">
        <span class="glyphicon glyphicon-download-alt"></span>
        {{'options_makeBackup' | tr}}
      </button>
    </div>
  </section>

  <section class="io-card">
    <div class="io-card-icon io-card-icon-import" aria-hidden="true">
      <span class="glyphicon glyphicon-folder-open"></span>
    </div>
    <div class="io-card-body">
      <h3>{{'options_ioImportTitle' | tr}}</h3>
      <p class="help-block">{{'options_restoreLocalHelp' | tr}}</p>
      <input id="restore-local-file" class="omega-file-input" type="file"
             accept=".bak,.json,application/json"
             omega-upload="restoreLocal($content)"
             omega-error="restoreLocalError($error)"/>
      <button ng-click="triggerFileInput()" ladda="restoringLocal"
              data-spinner-color="#000000" class="btn btn-default">
        <span class="glyphicon glyphicon-upload"></span>
        {{'options_restoreLocal' | tr}}
      </button>
    </div>
  </section>
</div>
