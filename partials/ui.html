
<div class="page-header">
  <h2>{{'options_tab_ui' | tr}}</h2>
  <p>调整日常使用习惯，让代理操作更顺手。</p>
</div>
<section class="settings-group preferences">
  <h3>{{'options_group_miscOptions' | tr}}</h3>
  <div class="checkbox">
    <label>
      <input type="checkbox" ng-model="options[&quot;-confirmDeletion&quot;]"/><span>{{'options_confirmDeletion' | tr}}</span><span class="preference-help">删除模式或规则前先确认，避免误操作。</span>
    </label>
  </div>
  <div class="checkbox">
    <label>
      <input id="refresh-on-profile-change" type="checkbox" ng-model="options[&quot;-refreshOnProfileChange&quot;]"/><span>{{'options_refreshOnProfileChange' | tr}}</span><span class="preference-help">选择另一模式后，重新加载当前标签页。</span>
    </label>
  </div>
  <div class="checkbox">
    <label>
      <input type="checkbox" ng-model="options[&quot;-addConditionsToBottom&quot;]"/><span>{{'options_addConditionsToBottom' | tr}}</span><span class="preference-help">保留已有规则顺序，将新规则放在列表末尾。</span>
    </label>
  </div>
  <div class="checkbox">
    <label>
      <input type="checkbox" ng-model="options[&quot;-showResultProfileOnActionBadgeText&quot;]"/><span>{{'options_showResultProfileOnActionBadgeText' | tr}}</span><span class="preference-help">在工具栏图标上显示当前网站实际使用的模式。</span>
    </label>
  </div>
</section>
